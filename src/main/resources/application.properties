spring.application.name=riayati-middleware
# Server Settings
server.port=8066

# DHPO Integration Credentials & Endpoints
dhpo.client.endpoint=https://dhpo.eclaimlink.ae/ValidateTransactions.asmx
dhpo.client.default-uri=http://www.eClaimLink.ae/
dhpo.client.username=YOUR_LOGIN_ID
dhpo.client.password=YOUR_PASSWORD

riayati.username=${RIAYATI_USERNAME:YOUR_FACILITY_LICENSE}
riayati.password=${RIAYATI_PASSWORD:YOUR_API_PASSWORD}
riayati.senderId=${RIAYATI_SENDER_ID:YOUR_LICENSE}
riayati.receiverId=${RIAYATI_RECEIVER_ID:PAYER_LICENSE}
riayati.payerId=${RIAYATI_PAYER_ID:PAYER_LICENSE}

# mTLS Security Settings
dhpo.security.key-store=classpath:keystore/dhpo-client.p12
dhpo.security.key-store-password=YOUR_CERT_PASSWORD
dhpo.security.key-store-type=PKCS12

# Scheduler fixed Delay
riayati.eligibility.polling.delay=60000
riayati.authorization.polling.delay=50000
riayati.claim.polling.delay=45000
riayati.erx.polling.delay=50000
riayati.dispense.polling.delay=40000
riayati.penalty.polling.delay=60000